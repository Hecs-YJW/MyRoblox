<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>My Roblox</title>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="/socket.io/socket.io.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f4f5f7;color:#17181c}button,input{font:inherit}button{cursor:pointer;border:0}#app{min-height:100vh}.hidden{display:none!important}.page{min-height:100vh}.top{height:64px;background:#fff;border-bottom:1px solid #e5e7eb;display:flex;align-items:center;padding:0 20px;gap:18px;position:sticky;top:0;z-index:20}.logo{font-weight:950;font-size:24px;letter-spacing:-1.5px}.logo span{color:#e91e63}.nav{display:flex;gap:20px;font-weight:700;font-size:14px}.nav button{background:none;color:#555}.spacer{flex:1}.iconbtn{width:40px;height:40px;border-radius:12px;background:#f2f3f5}.avatar{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#111,#777);color:#fff;display:grid;place-items:center;font-weight:900}.pill{background:#17181c;color:#fff;border-radius:999px;padding:7px 12px;font-size:12px;font-weight:800}.login-wrap{min-height:100vh;background:radial-gradient(circle at 15% 10%,#444 0,#17181c 38%,#08090b 100%);color:#fff;display:grid;place-items:center;padding:24px}.auth-card{width:min(440px,100%);background:rgba(255,255,255,.97);color:#17181c;border-radius:24px;padding:32px;box-shadow:0 30px 90px rgba(0,0,0,.45)}.brand{font-size:32px;font-weight:950;letter-spacing:-2px;margin-bottom:6px}.muted{color:#70757d}.tabs{display:grid;grid-template-columns:1fr 1fr;background:#eef0f2;border-radius:12px;padding:4px;margin:22px 0}.tabs button{padding:10px;border-radius:9px;background:transparent;font-weight:800}.tabs .on{background:#fff;box-shadow:0 2px 8px #0001}.field{margin:13px 0}.field label{font-size:13px;font-weight:800;display:block;margin-bottom:7px}.field input{width:100%;padding:13px 14px;border:1px solid #d9dce1;border-radius:12px;outline:none;background:#fff}.field input:focus{border-color:#111;box-shadow:0 0 0 3px #1111}.primary{width:100%;padding:14px;border-radius:12px;background:#111;color:#fff;font-weight:900;margin-top:8px}.secondary{width:100%;padding:12px;border-radius:12px;background:#eceef1;font-weight:800;margin-top:10px}.msg{min-height:20px;color:#d9274f;font-size:13px;font-weight:700;margin-top:10px}.main{max-width:1250px;margin:auto;padding:28px 22px}.hero{display:flex;align-items:end;justify-content:space-between;gap:20px}.hero h1{font-size:34px;margin:8px 0}.hero p{margin:0;color:#6b7078}.section{margin-top:30px}.section-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.section-head h2{font-size:20px;margin:0}.friendbar{background:#fff;border:1px solid #e7e8eb;border-radius:18px;padding:16px;display:flex;gap:12px;align-items:center;overflow:auto}.friend{min-width:130px;padding:14px;border-radius:15px;background:#f6f7f8}.friend-name{font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.online{font-size:12px;color:#20a05a;font-weight:800;margin-top:4px}.offline{font-size:12px;color:#888;margin-top:4px}.add{min-width:130px;min-height:86px;border:2px dashed #d5d7db;border-radius:15px;background:#fff;font-weight:900}.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}.game{background:#fff;border:1px solid #e7e8eb;border-radius:18px;overflow:hidden;transition:.18s;box-shadow:0 5px 18px #00000009}.game:hover{transform:translateY(-3px);box-shadow:0 12px 30px #00000012}.thumb{height:130px;display:grid;place-items:center;font-size:38px;background:linear-gradient(135deg,#d9dde3,#fff)}.game:nth-child(2) .thumb{background:linear-gradient(135deg,#c8d7ff,#fff)}.game:nth-child(3) .thumb{background:linear-gradient(135deg,#ffd2d2,#fff)}.game:nth-child(4) .thumb{background:linear-gradient(135deg,#d9f2d0,#fff)}.game:nth-child(5) .thumb{background:linear-gradient(135deg,#d7e8ff,#fff)}.game:nth-child(6) .thumb{background:linear-gradient(135deg,#ffe4c5,#fff)}.gamebody{padding:14px}.gamebody h3{margin:0 0 5px;font-size:15px}.gamebody p{margin:0;color:#777;font-size:12px}.play{width:100%;margin-top:12px;padding:10px;border-radius:10px;background:#111;color:#fff;font-weight:900}.drawer{position:fixed;inset:0;z-index:50;background:#0007}.drawer-panel{width:min(330px,88%);height:100%;background:#fff;padding:22px;box-shadow:15px 0 50px #0003}.drawer-panel button{width:100%;text-align:left;padding:13px;border-radius:10px;background:#fff;font-weight:800}.drawer-panel button:hover{background:#f2f3f5}.modal{position:fixed;inset:0;z-index:60;background:#0008;display:grid;place-items:center;padding:20px}.modal-card{background:#fff;width:min(430px,100%);border-radius:20px;padding:24px}.modal-card h2{margin-top:0}.modal-actions{display:flex;gap:10px;margin-top:16px}.modal-actions button{flex:1;padding:12px;border-radius:11px;font-weight:900}.game-page{height:100vh;background:#101317;color:#fff;display:flex;flex-direction:column}.game-top{height:58px;display:flex;align-items:center;padding:0 14px;gap:10px;background:#171a20;z-index:5}.game-top button{background:#252a32;color:#fff;border-radius:10px;padding:9px 12px}.game-title{font-weight:900}.game-canvas{position:relative;flex:1;overflow:hidden}.game-canvas canvas{width:100%;height:100%;display:block}.hud{position:absolute;left:14px;bottom:18px;display:flex;gap:10px;align-items:end;pointer-events:none}.joy{width:110px;height:110px;border-radius:50%;background:#fff2;border:1px solid #fff4;position:relative;pointer-events:auto;touch-action:none}.knob{width:48px;height:48px;border-radius:50%;background:#fff8;position:absolute;left:31px;top:31px}.jump{width:72px;height:72px;border-radius:50%;background:#fff;color:#111;font-weight:950;pointer-events:auto}.status{position:absolute;right:14px;top:14px;background:#0008;border:1px solid #fff2;padding:8px 11px;border-radius:10px;font-size:12px}.toast{position:fixed;left:50%;bottom:25px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 15px;border-radius:12px;z-index:100;font-weight:800;box-shadow:0 10px 30px #0005}@media(max-width:700px){.nav{display:none}.top{padding:0 12px}.main{padding:20px 14px}.hero h1{font-size:28px}.games{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.thumb{height:105px}.gamebody{padding:11px}.friendbar{margin:0 -2px}.auth-card{padding:25px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast hidden"></div>
<script>
const app=document.getElementById('app');
let me=null,socket=null,currentGame=null,scene=null,camera=null,renderer=null,player=null,keys={},remotePlayers=new Map(),lastNet=0,joy={x:0,y:0};
const games=[['크레이지 파티','🎉','RPG'],['회사 시뮬레이션','🏢','Simulation'],['레드 액션 아레나','⚔️','Action'],['Lumber Tycoon 2','🌲','Tycoon'],['네온 배틀','⚡','Battle'],['섬의 모험','🏝️','Adventure']];
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.remove('hidden');clearTimeout(window._toast);window._toast=setTimeout(()=>el.classList.add('hidden'),2300)}
async function api(url,opt={}){const r=await fetch(url,{headers:{'Content-Type':'application/json',...(opt.headers||{})},...opt});let d={};try{d=await r.json()}catch{};if(!r.ok)throw new Error(d.error||'요청에 실패했습니다.');return d}
function authPage(tab='login'){app.innerHTML=`<div class="login-wrap"><div class="auth-card"><div class="brand">My <span>Roblox</span></div><div class="muted">친구들과 함께 만드는 온라인 게임 세계</div><div class="tabs"><button class="${tab==='login'?'on':''}" onclick="authPage('login')">로그인</button><button class="${tab==='signup'?'on':''}" onclick="authPage('signup')">회원가입</button></div><form id="authForm"><div class="field"><label>아이디</label><input id="username" autocomplete="username" required maxlength="20" placeholder="아이디를 입력하세요"></div><div class="field"><label>비밀번호</label><input id="password" type="password" autocomplete="${tab==='login'?'current-password':'new-password'}" required placeholder="비밀번호"></div>${tab==='signup'?'<div class="field"><label>비밀번호 확인</label><input id="confirmPassword" type="password" autocomplete="new-password" required placeholder="비밀번호를 한 번 더 입력하세요"></div>':''}<button class="primary">${tab==='login'?'로그인':'계정 만들기'}</button><div id="authMsg" class="msg"></div></form><div class="muted" style="font-size:12px;margin-top:15px">서버에 계정이 저장됩니다. 비밀번호는 암호화된 해시로 저장됩니다.</div></div></div>`;document.getElementById('authForm').onsubmit=async e=>{e.preventDefault();const msg=document.getElementById('authMsg');try{const d=await api(tab==='login'?'/api/auth/login':'/api/auth/signup',{method:'POST',body:JSON.stringify({username:username.value,password:password.value,confirmPassword:document.getElementById('confirmPassword')?.value})});me=d.user;enterHome()}catch(err){msg.textContent=err.message}}}
function enterHome(){renderHome();connectSocket();loadFriends()}
function renderHome(){app.innerHTML=`<div class="page"><header class="top"><button class="iconbtn" onclick="openDrawer()">☰</button><div class="logo">My <span>Roblox</span></div><div class="pill">ONLINE</div><nav class="nav"><button>홈</button><button>게임</button><button>아바타</button><button>만들기</button></nav><div class="spacer"></div><button class="iconbtn" onclick="toast('검색 기능은 다음 업데이트에서 추가됩니다.')">⌕</button><div class="avatar">${escapeHtml(me.username[0].toUpperCase())}</div></header><main class="main"><div class="hero"><div><div class="muted">환영합니다, ${escapeHtml(me.username)}님 👋</div><h1>무엇을 플레이할까요?</h1><p>같은 게임에 들어온 플레이어들과 실시간으로 만나보세요.</p></div></div><section class="section"><div class="section-head"><h2>친구</h2><button class="secondary" style="width:auto;margin:0;padding:9px 12px" onclick="openFriendModal()">+ 친구 추가</button></div><div id="friends" class="friendbar"><div class="muted">친구 목록을 불러오는 중...</div></div></section><section class="section"><div class="section-head"><h2>추천 게임</h2></div><div class="games">${games.map((g,i)=>`<article class="game"><div class="thumb">${g[1]}</div><div class="gamebody"><h3>${g[0]}</h3><p>${g[2]} · 온라인 멀티플레이</p><button class="play" onclick="startGame(${i})">▶ 플레이</button></div></article>`).join('')}</div></section></main></div>`}
function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
async function loadFriends(){try{const d=await api('/api/friends');const el=document.getElementById('friends');if(!el)return;let html='';d.friends.forEach(f=>html+=`<div class="friend"><div class="friend-name">${escapeHtml(f.username)}</div><div class="${f.online?'online':'offline'}">${f.online?'● 온라인':'○ 오프라인'}</div></div>`);if(!html)html='<div class="muted" style="padding:12px">아직 친구가 없습니다. 친구를 추가해 보세요!</div>';if(d.incoming.length)html+=d.incoming.map(f=>`<div class="friend"><div class="friend-name">${escapeHtml(f.username)}</div><button class="play" onclick="acceptFriend(${f.friendshipId})">수락</button></div>`).join('');html+='<button class="add" onclick="openFriendModal()">＋<br>친구 추가</button>';el.innerHTML=html}catch(e){}}
async function acceptFriend(id){try{await api('/api/friends/'+id+'/accept',{method:'POST'});toast('친구가 추가되었습니다!');loadFriends()}catch(e){toast(e.message)}}
function openFriendModal(){const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="modal-card"><h2>친구 추가</h2><p class="muted">가입한 친구의 아이디를 입력하세요.</p><div class="field"><input id="friendUsername" placeholder="친구 아이디"></div><div id="friendMsg" class="msg"></div><div class="modal-actions"><button style="background:#eceef1" onclick="this.closest('.modal').remove()">취소</button><button style="background:#111;color:#fff" onclick="sendFriend(this)">친구 요청</button></div></div>`;document.body.appendChild(m)}
async function sendFriend(btn){const u=document.getElementById('friendUsername').value.trim();try{await api('/api/friends/request',{method:'POST',body:JSON.stringify({username:u})});btn.closest('.modal').remove();toast('친구 요청을 보냈습니다!');loadFriends()}catch(e){document.getElementById('friendMsg').textContent=e.message}}
function openDrawer(){const d=document.createElement('div');d.className='drawer';d.innerHTML=`<div class="drawer-panel"><div class="logo" style="margin-bottom:20px">My <span>Roblox</span></div><button onclick="this.closest('.drawer').remove()">🏠 홈</button><button onclick="toast('인벤토리는 준비 중입니다.')">🎒 인벤토리</button><button onclick="openFriendModal();this.closest('.drawer').remove()">👥 친구 추가</button><button onclick="toast('설정은 준비 중입니다.')">⚙️ 설정</button><button onclick="logout()">🚪 로그아웃</button></div>`;d.onclick=e=>{if(e.target===d)d.remove()};document.body.appendChild(d)}
async function logout(){try{await api('/api/auth/logout',{method:'POST'})}catch{};if(socket){socket.disconnect();socket=null}me=null;authPage('login')}
function connectSocket(){if(socket?.connected)return;socket=io({transports:['websocket','polling']});socket.on('connect_error',e=>toast('서버 연결에 실패했습니다.'));socket.on('game:state',d=>d.players.forEach(addRemote));socket.on('player:joined',addRemote);socket.on('player:update',d=>{const p=remotePlayers.get(d.id);if(p){p.tx=d.x;p.ty=d.y;p.tz=d.z;p.try=d.ry}});socket.on('player:left',d=>removeRemote(d.id));}
function startGame(i){currentGame=games[i][0];if(socket?.connected){socket.emit('game:join',{game:currentGame})}renderGamePage();setTimeout(init3D,50)}
function renderGamePage(){app.innerHTML=`<div class="game-page"><div class="game-top"><button onclick="leaveGame()">← 나가기</button><div class="game-title">${escapeHtml(currentGame)}</div><div class="spacer"></div><span id="onlineStatus" class="pill">연결 중...</span></div><div id="gameCanvas" class="game-canvas"><div class="status">WASD / 방향키 · 점프: Space<br>같은 게임에 있는 플레이어가 보입니다.</div><div class="hud"><div id="joy" class="joy"><div id="knob" class="knob"></div></div><button id="jump" class="jump">점프</button></div></div></div>`}
function init3D(){const el=document.getElementById('gameCanvas');scene=new THREE.Scene();scene.background=new THREE.Color(0x9ed9ff);camera=new THREE.PerspectiveCamera(60,el.clientWidth/el.clientHeight,.1,1000);camera.position.set(7,6,9);renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(el.clientWidth,el.clientHeight);el.prepend(renderer.domElement);scene.add(new THREE.HemisphereLight(0xffffff,0x557766,1.2));const sun=new THREE.DirectionalLight(0xffffff,1);sun.position.set(5,10,3);scene.add(sun);const ground=new THREE.Mesh(new THREE.BoxGeometry(80,.5,80),new THREE.MeshStandardMaterial({color:0x55a84f}));ground.position.y=-.25;scene.add(ground);for(let i=0;i<25;i++){const b=new THREE.Mesh(new THREE.BoxGeometry(1+Math.random()*2,1+Math.random()*3,1+Math.random()*2),new THREE.MeshStandardMaterial({color:0x7a8790}));b.position.set((Math.random()-.5)*55,.5,(Math.random()-.5)*55);scene.add(b)}player=createPlayer(me.username,true);player.position.set(0,1,0);scene.add(player);setupControls();window.onresize=resize3D;animate();if(socket?.connected){socket.emit('game:join',{game:currentGame});document.getElementById('onlineStatus').textContent='● 온라인'}}
function createPlayer(name,isMe=false){const g=new THREE.Group();const mat=new THREE.MeshStandardMaterial({color:isMe?0x1677ff:0xff6b35});const body=new THREE.Mesh(new THREE.BoxGeometry(1,1.3,.65),mat);body.position.y=.65;g.add(body);const head=new THREE.Mesh(new THREE.BoxGeometry(.8,.8,.8),new THREE.MeshStandardMaterial({color:0xffd2a6}));head.position.y=1.7;g.add(head);const canvas=document.createElement('canvas');canvas.width=256;canvas.height=64;const c=canvas.getContext('2d');c.fillStyle='white';c.font='bold 28px sans-serif';c.textAlign='center';c.fillText(name.slice(0,16),128,40);const tex=new THREE.CanvasTexture(canvas);const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true}));sp.scale.set(2.7,.67,1);sp.position.y=2.35;g.add(sp);return g}
function addRemote(d){if(!d||d.id===me?.id||remotePlayers.has(d.id))return;const obj=createPlayer(d.username,false);obj.position.set(d.x,d.y,d.z);scene?.add(obj);remotePlayers.set(d.id,{obj,tx:d.x,ty:d.y,tz:d.z,try:d.ry||0})}
function removeRemote(id){const p=remotePlayers.get(id);if(p&&scene){scene.remove(p.obj);p.obj.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material)o.material.dispose()})}remotePlayers.delete(id)}
function setupControls(){window.onkeydown=e=>{keys[e.key.toLowerCase()]=true;if(e.code==='Space'){e.preventDefault();jump()}};window.onkeyup=e=>keys[e.key.toLowerCase()]=false;document.getElementById('jump').onclick=jump;const j=document.getElementById('joy'),k=document.getElementById('knob');const move=e=>{const r=j.getBoundingClientRect(),x=(e.clientX??e.touches?.[0]?.clientX)-r.left-r.width/2,y=(e.clientY??e.touches?.[0]?.clientY)-r.top-r.height/2;const max=35,len=Math.hypot(x,y)||1,s=Math.min(1,max/len);joy.x=x/r.width*2*s;joy.y=y/r.height*2*s;k.style.transform=`translate(${x*s}px,${y*s}px)`};const end=()=>{joy.x=joy.y=0;k.style.transform='translate(0,0)'};j.onpointermove=move;j.onpointerdown=e=>{j.setPointerCapture(e.pointerId);move(e)};j.onpointerup=end;j.onpointercancel=end}
let vy=0,onGround=true;function jump(){if(onGround){vy=.19;onGround=false}}
function animate(){requestAnimationFrame(animate);if(!renderer||!player)return;const dirX=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+joy.x;const dirZ=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0)+joy.y;const len=Math.hypot(dirX,dirZ)||1;player.position.x+=dirX/len*.12;player.position.z+=dirZ/len*.12;vy-=.008;player.position.y+=vy;if(player.position.y<=1){player.position.y=1;vy=0;onGround=true}camera.position.lerp(new THREE.Vector3(player.position.x+7,player.position.y+5.5,player.position.z+8),.08);camera.lookAt(player.position.x,player.position.y+1,player.position.z);for(const p of remotePlayers.values()){p.obj.position.x+=(p.tx-p.obj.position.x)*.18;p.obj.position.y+=(p.ty-p.obj.position.y)*.18;p.obj.position.z+=(p.tz-p.obj.position.z)*.18;p.obj.rotation.y+=(p.try-p.obj.rotation.y)*.18}const now=performance.now();if(socket?.connected&&now-lastNet>100){lastNet=now;socket.emit('player:update',{x:player.position.x,y:player.position.y,z:player.position.z,ry:player.rotation.y})}renderer.render(scene,camera)}
function resize3D(){if(!renderer||!camera)return;const el=document.getElementById('gameCanvas');camera.aspect=el.clientWidth/el.clientHeight;camera.updateProjectionMatrix();renderer.setSize(el.clientWidth,el.clientHeight)}
function leaveGame(){if(socket?.connected)socket.emit('game:leave');remotePlayers.forEach(p=>scene?.remove(p.obj));remotePlayers.clear();scene=null;renderer?.dispose();renderer=null;currentGame=null;renderHome();loadFriends()}
(async function(){try{const d=await api('/api/auth/me');me=d.user;enterHome()}catch{authPage('login')}})();
</script>
</body>
</html>
